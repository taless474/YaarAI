[project]
name = "yaarai"
version = "0.1.0"
description = "YaarAI: beyt-level semantic Fal-e-Hafez retrieval and interpretation pipeline"
requires-python = ">=3.11"
dependencies = [
  # --- Web app runtime ---
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
  "python-dotenv>=1.0",

  # --- Data / analysis ---
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
  "matplotlib>=3.7",
]

# Optional, for clustering notebooks/experiments.
clustering = [
  "hdbscan>=0.8.33",
]

# Optional, if you run labeling/annotation via OpenAI.
openai = [
  "openai>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
